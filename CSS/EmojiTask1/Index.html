<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        body ,html{
            height: 100%;
            width: 100%;
            background-color:whitesmoke;
            display: flex;
            align-items: center;
            justify-content: center ;

        }
        .main{
            height: 300px;
            width: 300px;
           
            
        }
        .emoji{
            background-color:yellow;
            height: 100%;
            width: 100%;
            border-radius: 50%;

            display: flex;
            flex-direction: column;
            align-items: center;
            
            justify-content: space-evenly;




        }
        .eyes{
            height:20%;
            width: 100%;
           
            display: flex;
            justify-content: space-around;
            border-radius: 50%;
          
        }
        .eye{
            height: 50px;
            width: 50px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: flex-end;
             animation-name:eyeRotate;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        .eyeball{
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: black;


        }
        @keyframes eyeRotate {
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
            
        }
        .eyeball1{
              height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: black;
        }
        .mouth{
             height:20%;
            width: 100%;
            
            display: flex;
            align-items: center;
            justify-content: center;
          
                

        }
        .hello{
            background-color:red;
            height: 50px;
            width: 50px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
          
           
            
        }
        
        

    </style>



</head>
<body>
    <section class="main">
        <article class="emoji">
            <aside class="eyes">
                <div class="eye">
                    <div class="eyeball"></div>
                </div>
                <div class="eye">
                    <div class="eyeball1"></div>
                </div>
            </aside>
            <aside class="mouth">
                <div class="hello">

                </div>
            </aside>
        </article>
    </section>
    

</body>
</html>
