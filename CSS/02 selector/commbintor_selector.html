<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* decendent */
        section div{
            background-color: red;
        }

        /*child*/
        section>div{
            background-color: yellow;
        }
        /*general siblings*/
        section ~ div{
            background-color: maroon;
        }

        /*adjacent sibling*/

        section + div{
            background-color: blue;
        }


    </style>
</head>
<body>

    <!-- THere are four types :
     1. Decendent     ;- targets difect child as well as nested child elments
                  --denoted by empty spave 
     2. child            :- targets direct child elements
                    --denoted by grater than symbol >

     3. General siblings  :- targets multiple elements after the closing tag 
                     --denoted by tilde symbol ~

     4.adjacent siblings :-targets single element which is immediate after the closing tag 
                                     denoted by plus symbol +
     -->

     <section>
        <div>div 1</div>
        <div>div 2</div>

        <article>
            <div>div 3</div>
            <div>div 4</div>
        </article>

        <div>div 5</div>
     </section>
       <div>div 6</div>
       <div>div 7</div>
     
    
</body>
</html>
