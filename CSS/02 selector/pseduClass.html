<head>

    <title>Document</title>
    <style>
        button{
            transition: 1s;
        }
        button:hover{
            background-color: red;
            color: white;
            transform: scale(1.5);
        }
        button:active{
            background-color: pink;
        }


        a:link{
            color: greenyellow;
        }
        a:visited{
            color: aqua;
        }
        a:active{
            color: blue;
        }


        ol>li:first-child{
            background-color: red;
        }
        ol>li:last-child{
            background-color: blue;

        }
        ol>li:nth-child(3){
            background-color: aqua;
        }

        div>nav:first-of-type{
            background-color: orange;
        }
        div>nav:last-of-type{
            background-color: aqua;

        }

    div>nav:nth-of-type(3){
        background-color:aquamarine;
    }



    </style>
</head>
