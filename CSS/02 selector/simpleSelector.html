<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            font-family: sans-serif;
            background-color: whitesmoke;
        }
        #nav-bar, footer, .page_header{
            background-color: rosybrown;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 5 types of selector 
    1. simple selector --------5
    2. combinator --------4
    3. pseudo - class ----6--7
    4. pseudo element ------6--7
    5. attribute -----7
    -->




    <!-- Simple selector -->


    <!-- there are 5 types 
    1. id: used to target unique element 
    2. class: used to target multiple similar or diff element
    3. element: used to target multiple similar element . symbol is tagname;
    4. group : used to group multiple element symbol is comma
    5. universal : used to target all element in webpage . symbol is * 
    -->





    <nav id="nav-bar">I am nav </nav>
    <footer >I am footer</footer>
    <header class="page_header">I am header</header>
</body>
</html>
