<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        input::placeholder{
            background-color: red;
        }
        h1::selection{
            background-color:aqua;
            color: whitesmoke;

        }

        h2::after{
            content: "👌👌😘😘";
        }

        ol>li::marker{
             color: red;
        }

        p::first-letter{
            color: aqua;
        }
        p::first-line{
            color: pink;
        }
    </style>
</head>
<body>


    <h1>Learn Pseudo Element selectors</h1>
   <input type="text" name="" placeholder="Hello World" id="">
   <h2>Frontend Course </h2>
<ol>
   <li>HTML</li>
   <li>CSS</li>
   <li>JS</li>
   </ol>

</html>
